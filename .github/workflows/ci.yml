name: Firmware Approval CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-artifact:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Scan Python code with Bandit
        run: bandit -r app.py -ll

      - name: Scan dependencies with pip-audit
        run: pip-audit -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Generate and verify demo artifact
        run: bash scripts/verify_ci_artifact.sh

      - name: Upload demo artifact and checksum
        uses: actions/upload-artifact@v6
        with:
          name: firmware-demo-artifact
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 7

  build-and-publish:
    needs: verify-artifact
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Download demo artifact
        uses: actions/download-artifact@v6
        with:
          name: firmware-demo-artifact
          path: build-artifacts

      - name: Verify downloaded artifact checksum
        run: |
          cd build-artifacts
          sha256sum --check firmware-build-info.sha256

      - name: Build Docker image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t firmware-signing-approval:ci .

      - name: Generate Trivy JSON security report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: firmware-signing-approval:ci
          format: json
          output: trivy-report.json
          exit-code: '0'
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Enforce Trivy security threshold
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: firmware-signing-approval:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Upload Trivy security report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-security-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag firmware-signing-approval:ci "$IMAGE:${GITHUB_SHA}"
          docker tag firmware-signing-approval:ci "$IMAGE:latest"

      - name: Publish Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
